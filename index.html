let UI={day:"mon",q:"",track:"All",hideAdded:false,picks:false,editing:null,adding:false,status:"Saved on this device",ref:null};

const $=s=>document.querySelector(s);
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins=t=>{const [a,b]=t.split(":").map(Number);return a*60+b};
const fmt=t=>{if(!t)return"";let [a,b]=t.split(":").map(Number);const p=a>=12?"PM":"AM";a=a%12||12;return a+":"+String(b).padStart(2,"0")+" "+p};
const toHHMM=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

function entries(day){
  const out=S.items.filter(i=>i.day===day).map(i=>({...i,src:"item"}));
  for(const id of S.attend){const s=CAT[id];if(s&&s.day===day){out.push({id:s.id,kind:"session",day,start:s.start,end:s.end,est:false,title:s.title,loc:s.loc,note:s.why,url:LINK(s.id),src:"cat"})}}
  out.sort((a,b)=>mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end));
  return out;
}
function clashes(list){
  const m=new Map();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end)){
      (m.get(a.id)||m.set(a.id,[]).get(a.id)).push(b.title);
      (m.get(b.id)||m.set(b.id,[]).get(b.id)).push(a.title);
    }
  }
  return m;
}
const short=t=>t.length>60?t.slice(0,57)+"…":t;

function dayTab(d){
  const l=entries(d.k),c=clashes(l);
  return `<button class="tab" role="tab" data-act="day" data-v="${d.k}" aria-selected="${UI.day===d.k}"><b>${d.n} Nov ${d.d}</b><span>${l.length} planned${c.size?` · <span class="bad">${c.size} overlapping</span>`:""}</span></button>`;
}
function itemCard(e,clash,trip){
  if(UI.editing===e.id&&e.src==="item")return editCard(e);
  const k=e.kind;
  return `<article class="card${clash?" conflict":""}">
    <div class="time tabular">${fmt(e.start)}<small>to ${e.est?"~":""}${fmt(e.end)}</small></div>
    <div style="min-width:0"><p class="title">${h(e.title)}</p>
    ${e.loc?`<div class="loc">${h(e.loc)}</div>`:""}
    ${e.note?`<div class="note">${h(e.note)}</div>`:""}
    <div class="chips"><span class="chip k-${k}">${KINDS[k]||"Other"}</span>${venue(e.loc)?`<span class="chip k-other">${venue(e.loc)}</span>`:""}${e.src==="cat"&&PICKS.has(e.id)?`<span class="chip k-meet">Suggested</span>`:""}${e.confirm?`<span class="chip confirm">Confirm</span>`:""}</div>
    ${clash?`<div class="clash">Overlaps with ${clash.map(t=>h(short(t))).join("; ")}</div>`:""}
    ${trip?`<div class="clash">${h(trip)}</div>`:""}
    <div class="actions">${e.url?`<a class="btn" href="${h(e.url)}" target="_blank" rel="noopener">Open session ↗</a>`:""}<a class="btn" href="${h(gcal(e))}" target="_blank" rel="noopener">Add to Google Calendar ↗</a>${e.src==="item"?`<button data-act="edit" data-v="${h(e.id)}">Edit</button><button class="danger" data-act="del" data-v="${h(e.id)}">Remove</button>`:`<button class="danger" data-act="unattend" data-v="${h(e.id)}">Remove from plan</button>`}</div></div></article>`;
}
function fields(v,p){
  const dayOpts=DAYS.map(d=>`<option value="${d.k}"${v.day===d.k?" selected":""}>${d.n} Nov ${d.d}</option>`).join("");
  const kindOpts=Object.entries(KINDS).filter(([k])=>k!=="session").map(([k,n])=>`<option value="${k}"${v.kind===k?" selected":""}>${n}</option>`).join("");
  return `<label>What<input id="${p}-title" value="${h(v.title)}" placeholder="e.g. KubeVela kiosk shift"></label>
    <div class="grid2">
      <label>Type<select id="${p}-kind">${kindOpts}</select></label>
      <label>Day<select id="${p}-day">${dayOpts}</select></label>
      <label>Starts (MST)<input id="${p}-start" type="time" value="${h(v.start)}"></label>
      <label>Ends (MST)<input id="${p}-end" type="time" value="${h(v.end)}"></label>
    </div>
    <label>Location<input id="${p}-loc" value="${h(v.loc)}" placeholder="Hall, room or kiosk"></label>
    <label>Notes<input id="${p}-note" value="${h(v.note)}" placeholder="Optional"></label>`;
}
function editCard(e){
  return `<article class="card"><div class="editrow" style="margin:0">${fields(e,"e")}
    <div class="actions"><button class="primary" data-act="saveedit" data-v="${h(e.id)}">Save</button><button data-act="canceledit">Cancel</button></div></div></article>`;
}
function readFields(p){
  const g=id=>$("#"+p+"-"+id).value;
  return {title:g("title").trim(),kind:g("kind"),day:g("day"),start:g("start"),end:g("end"),loc:g("loc").trim(),note:g("note").trim()};
}
function validate(v){
  if(!v.title)return"Add a title.";
  if(!v.start||!v.end)return"Set a start and end time.";
  if(mins(v.end)<=mins(v.start))return"End time must be after the start time.";
  return"";
}
function addForm(){
  const blank={title:"",kind:"booth",day:UI.day,start:"10:00",end:"11:00",loc:"",note:""};
  return `<div class="form">${fields(blank,"n")}<div id="n-err" class="clash" hidden></div>
    <div class="actions"><button class="primary" data-act="saveadd">Add to ${DAYS.find(d=>d.k===UI.day).n} plan</button><button data-act="canceladd">Cancel</button></div></div>`;
}
function browser(){
  const q=UI.q.trim().toLowerCase();
  const list=C.filter(s=>s.day===UI.day&&(UI.track==="All"||s.track===UI.track)&&(!q||(s.title+" "+s.loc+" "+s.why).toLowerCase().includes(q))&&(!UI.hideAdded||!S.attend.includes(s.id))&&(!UI.picks||PICKS.has(s.id)));
  const rows=list.map(s=>{const on=S.attend.includes(s.id);return `<div class="s-item${on?" added":""}">
    <div class="time tabular">${fmt(s.start)}<small>${mins(s.end)-mins(s.start)} min</small></div>
    <div style="min-width:0"><p class="title">${h(s.title)}</p><div class="loc">${h(s.loc)}${venue(s.loc)?" · "+venue(s.loc):""}</div><div class="note">${h(s.why)} · ${s.track}${PICKS.has(s.id)?" · <b class=\"k-meet\">Suggested</b>":""}</div><a class="lnk" href="${LINK(s.id)}" target="_blank" rel="noopener">Open session ↗</a></div>
    <div class="btncol"><button data-act="${on?"unattend":"attend"}" data-v="${s.id}" class="${on?"":"primary"}" aria-pressed="${on}">${on?"Added":"Add"}</button><button data-act="later" data-v="${s.id}" aria-pressed="${(S.later||[]).includes(s.id)}">${(S.later||[]).includes(s.id)?"On video list":"Video later"}</button></div></div>`}).join("");
  return `<h2>Sessions to add</h2>
  <label for="q" style="margin-bottom:8px">Search<input id="q" type="search" value="${h(UI.q)}" placeholder="Title, room or topic"></label>
  <div class="filters">${["All",...TRACKS].map(t=>`<button class="pill" data-act="track" data-v="${t}" aria-pressed="${UI.track===t}">${t}</button>`).join("")}<button class="pill" data-act="picks" aria-pressed="${UI.picks}">Suggested only</button><button class="pill" data-act="hide" aria-pressed="${UI.hideAdded}">Hide added</button></div>
  <div>${rows||`<div class="empty">No sessions match on this day. Clear the search or pick another track.</div>`}</div>`;
}

const GDATE={sun:"20261108",mon:"20261109",tue:"20261110",wed:"20261111",thu:"20261112",fri:"20261113"};
function gcal(e){
  const t=x=>GDATE[e.day]+"T"+x.replace(":","")+"00";
  const details=[e.note,e.url?"Details: "+e.url:""].filter(Boolean).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent((e.kind==="booth"?"[Booth] ":e.kind==="talk"?"[My talk] ":"")+e.title)
    +"&dates="+t(e.start)+"/"+t(e.end)
    +"&ctz=America%2FDenver"
    +"&location="+encodeURIComponent(e.loc||"")
    +"&details="+encodeURIComponent(details);
}
const toggle=(a,v)=>a.includes(v)?a.filter(x=>x!==v):[...a,v];
function videoIds(){
  const order={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5};
  const ids=[...new Set([...S.attend.filter(i=>CAT[i]),...(S.later||[]).filter(i=>CAT[i])])];
  return ids.sort((a,b)=>order[CAT[a].day]-order[CAT[b].day]||mins(CAT[a].start)-mins(CAT[b].start));
}
function videoTab(){
  const ids=videoIds(),left=ids.filter(i=>!(S.seen||[]).includes(i)).length;
  return `<button class="tab" role="tab" data-act="day" data-v="videos" aria-selected="${UI.day==="videos"}"><b>Videos</b><span>${left} to watch</span></button>`;
}
function videosView(){
  const ids=videoIds(),left=ids.filter(i=>!(S.seen||[]).includes(i)).length;
  const rows=ids.map(id=>{
    const s=CAT[id],seen=(S.seen||[]).includes(id),note=(S.vnote||{})[id]||"";
    const q="https://www.youtube.com/results?search_query="+encodeURIComponent("KubeCon NA 2026 "+s.title);
    return `<article class="card${seen?" seen":""}"><div class="time tabular">${DAYS.find(d=>d.k===s.day).n}<small>${fmt(s.start)}</small></div>
      <div style="min-width:0"><p class="title">${h(s.title)}</p><div class="loc">${h(s.loc)}</div>
      <div class="actions"><a class="btn" href="${q}" target="_blank" rel="noopener">Find the video ↗</a><a class="btn" href="${LINK(id)}" target="_blank" rel="noopener">Session page ↗</a>
      <label class="chk"><input type="checkbox" data-act="seen" data-v="${id}"${seen?" checked":""}> Watched</label>
      ${S.attend.includes(id)?"":`<button class="danger" data-act="later" data-v="${id}">Remove</button>`}</div>
      <textarea data-vnote="${id}" rows="2" aria-label="Notes for ${h(s.title)}" placeholder="Notes to take back to the team">${h(note)}</textarea></div></article>`;
  }).join("");
  return `<section class="stack" style="grid-column:1/-1"><h2>Videos to review later: ${left} left of ${ids.length}</h2>
    <p class="note">Sessions in your plan show up here on their own. Add others with "Video later" in the session list. Recordings usually appear on the CNCF YouTube channel after the event. I don't have the video links yet, so "Find the video" opens a YouTube search for the session title.</p>
    ${rows||`<div class="empty">No sessions yet. Add some to your plan, or use "Video later" on a session.</div>`}</section>`;
}
function render(){
  const focus=document.activeElement&&document.activeElement.id==="q";
  const day=DAYS.find(d=>d.k===UI.day)||DAYS[1],l=entries(UI.day),cl=clashes(l),tr=travelWarn(l);
  $("#app").innerHTML=`
  <header><div><h1>KubeCon NA 2026 Planner</h1><p class="sub">Salt Lake City, Nov 8 to 12. All times MST. The Hyatt is connected to the Salt Palace, so that walk is short. Back-to-back sessions in different parts of the Salt Palace get a warning. The walking times are estimates.</p></div><span class="status" id="status">${h(UI.status)}</span></header>
  <details class="trip"><summary>Trip: hotel, flights and travel times</summary>
    <p>Set your own travel times below. The leave-by line on each day uses them.</p>
    <div class="grid2">
      <label>Hotel to the Salt Palace or Hyatt (min, door to door)<input id="t-commute" type="number" min="5" max="90" value="${S.trip.commute}"></label>
      <label>Hotel to the airport (min)<input id="t-airport" type="number" min="5" max="90" value="${S.trip.airport}"></label>
      <label>Time at the airport before departure (min)<input id="t-airbuf" type="number" min="30" max="240" value="${S.trip.airBuffer}"></label>
    </div>
    <p class="note">These are estimates. Check a map or a rideshare quote for your hotel and change the numbers.</p></details>
  <div class="tabs" role="tablist">${DAYS.map(dayTab).join("")}${videoTab()}</div>
  <div class="cols">
    <section class="stack"><h2>${day.n} Nov ${day.d}: your plan</h2>
      ${(()=>{const lb=leaveBy(UI.day);return lb?`<div class="leave">Leave the hotel by <b class="tabular">${fmt(lb.time)}</b> ${h(lb.why)}.</div>`:""})()}
      ${l.length?l.map(e=>itemCard(e,cl.get(e.id),tr.get(e.id))).join(""):`<div class="empty">Nothing planned for this day. Add a booth shift or event below, or pick sessions on the right.</div>`}
      ${UI.adding?addForm():`<button data-act="add" style="align-self:flex-start">+ Add booth shift, talk or event</button>`}
      <div class="actions"><button data-act="reset">Reset to the planner defaults</button></div>
    </section>
    <section id="browser">${browser()}</section>
  </div>`;
  if(UI.day==="videos"){const c=document.querySelector(".cols");if(c)c.outerHTML=videosView()}
  if(focus){const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function renderBrowser(){
  const el=$("#browser");if(!el)return render();
  el.innerHTML=browser();
  const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length);
}

function setStatus(t){UI.status=t;const s=$("#status");if(s)s.textContent=t}
let timer;
function leaveBy(day){
  const t=S.trip||DEFAULT_TRIP,l=entries(day);
  const fl=l.find(e=>e.id==="flight-back");
  if(fl)return{time:toHHMM(mins(fl.start)-t.airBuffer-t.airport),why:"for the "+fmt(fl.start)+" flight: "+t.airBuffer+" min at the airport plus "+t.airport+" min to get there"};
  const first=l.find(e=>venue(e.loc));
  if(!first)return null;
  const lead=first.kind==="talk"?15:first.kind==="booth"?10:5;
  return{time:toHHMM(mins(first.start)-lead-t.commute),why:"to be at \""+short(first.title)+"\" "+lead+" min before "+fmt(first.start)+", with "+t.commute+" min to get there"};
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(timer);
  if(!UI.ref){setStatus("Saved on this device");return}
  setStatus("Saving…");
  timer=setTimeout(async()=>{try{await UI.ref.set(JSON.parse(JSON.stringify({...S,v:1})));setStatus("Saved to your account")}catch(e){setStatus("Saved on this device only")}},500);
}
function change(fn){fn();persist();render()}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="day")return change(()=>{UI.day=v;UI.editing=null;UI.adding=false});
  if(a==="track"){UI.track=v;return render()}
  if(a==="hide"){UI.hideAdded=!UI.hideAdded;return render()}
  if(a==="picks"){UI.picks=!UI.picks;return render()}
  if(a==="later")return change(()=>{S.later=toggle(S.later||[],v)});
  if(a==="seen")return change(()=>{S.seen=toggle(S.seen||[],v)});
  if(a==="attend")return change(()=>{if(!S.attend.includes(v))S.attend.push(v)});
  if(a==="unattend")return change(()=>{S.attend=S.attend.filter(x=>x!==v)});
  if(a==="del")return change(()=>{S.items=S.items.filter(x=>x.id!==v)});
  if(a==="edit"){UI.editing=v;return render()}
  if(a==="canceledit"){UI.editing=null;return render()}
  if(a==="add"){UI.adding=true;return render()}
  if(a==="canceladd"){UI.adding=false;return render()}
  if(a==="saveedit"){const f=readFields("e"),err=validate(f);if(err){alert_(err);return}
    return change(()=>{const i=S.items.find(x=>x.id===v);Object.assign(i,f,{confirm:false});UI.editing=null})}
  if(a==="saveadd"){const f=readFields("n"),err=validate(f);if(err){const e=$("#n-err");e.textContent=err;e.hidden=false;return}
    return change(()=>{S.items.push({id:"i"+Date.now(),...f});UI.day=f.day;UI.adding=false})}
  if(a==="reset"){if(b.dataset.armed){return change(()=>{S={items:structuredClone(DEFAULT_ITEMS),attend:[...DEFAULT_ATTEND],trip:{...S.trip},later:S.later||[],seen:S.seen||[],vnote:S.vnote||{}};UI.editing=null;UI.adding=false})}
    b.dataset.armed="1";b.textContent="Click again to discard your changes";b.classList.add("danger")}
});
function alert_(msg){const c=document.querySelector(".card .editrow");let e=c.querySelector(".clash");if(!e){e=document.createElement("div");e.className="clash";c.insertBefore(e,c.querySelector(".actions"))}e.textContent=msg}
document.addEventListener("change",ev=>{
  if(ev.target.dataset&&ev.target.dataset.vnote){S.vnote={...(S.vnote||{}),[ev.target.dataset.vnote]:ev.target.value};persist();return}
  const m={"t-commute":"commute","t-airport":"airport","t-airbuf":"airBuffer"}[ev.target.id];
  if(!m)return;
  const v=Math.max(0,Math.min(300,parseInt(ev.target.value,10)||0));
  change(()=>{S.trip={...S.trip,[m]:v}});
  const d=document.querySelector("details.trip");if(d)d.open=true;
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){UI.q=ev.target.value;renderBrowser()}});

function load(d){
  if(!(d&&Array.isArray(d.items)&&Array.isArray(d.attend)))return false;
  const items=d.items.map(x=>x.id==="fluxcon"&&x.end==="10:45"?{...DEFAULT_ITEMS.find(i=>i.id==="fluxcon")}:x.id==="badge"&&x.day==="sun"&&x.start==="08:00"&&x.end==="17:00"?{...DEFAULT_ITEMS.find(i=>i.id==="badge")}:{...x});
  for(const di of DEFAULT_ITEMS)if(/^fluxcon/.test(di.id)&&!items.some(x=>x.id===di.id))items.push({...di});
  S={items,attend:[...d.attend],trip:{...DEFAULT_TRIP,...(d.trip||{})},later:d.later||[],seen:d.seen||[],vnote:d.vnote||{}};
  return true;
}
try{const raw=localStorage.getItem(KEY);if(raw)load(JSON.parse(raw))}catch(e){}
render();

(async()=>{
  try{
    const cl=window.claude;if(!cl||!cl.use)return;
    const [user,db]=await Promise.all([cl.use("user"),cl.use("db")]);
    if(!user||!db)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.collection("data/users/"+uid).doc("kubecon-plan-v3");
    const snap=await ref.get();
    UI.ref=ref;
    if(snap.exists&&load(snap.data())){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setStatus("Saved to your account");render()}
    else persist();
  }catch(e){}
})();
</script>

</body>
</html>
